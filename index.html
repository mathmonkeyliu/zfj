<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炸飞机 AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading" class="loading-overlay">
    <div>正在初始化 AI 引擎...</div>
    <div id="loading-progress" style="font-size: 0.9rem; color: #666; margin-top: 5px;">0%</div>
</div>

<div class="container" id="app" style="display: none;">
    <h1 id="title">实战演练</h1>

    <!-- Play Mode Controls -->
    <div id="play-controls" class="toolbar">
        <div class="btn-group">
            <button class="secondary btn-reset">再来一局</button>
            <button class="primary btn-ask">询问 AI</button>
        </div>
    </div>

    <!-- Explore Mode Controls -->
    <div id="explore-controls" class="toolbar" style="display: none;">
        <div class="palette">
            <div class="palette-item p-void" id="pal-1"></div>
            <div class="palette-item p-body" id="pal-2"></div>
            <div class="palette-item p-head" id="pal-3"></div>
        </div>
        <div class="btn-group">
            <button class="secondary btn-clear">清空棋盘</button>
            <button class="primary btn-ask">询问 AI</button>
        </div>
    </div>

    <div class="board" id="board">
        <!-- Cells generated by JS -->
    </div>

    <div class="status-text" id="status"></div>

    <div class="mode-switch">
        <a href="#" id="mode-link">进入自由探索模式</a>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
