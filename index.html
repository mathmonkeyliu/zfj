<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>炸飞机 AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<a href="https://github.com/mathmonkeyliu/zfj" target="_blank" class="github-corner" aria-label="View source on GitHub">
    <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
        <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
    </svg>
</a>

<div id="loading" class="loading-overlay">
    <div>正在初始化 AI 引擎...</div>
    <div id="loading-progress" style="font-size: 0.9rem; color: #666; margin-top: 5px;">0%</div>
</div>

<div class="container" id="app" style="display: none;">
    
    <div class="layout-header">
        <h1 id="title">实战演练</h1>
        <div class="algorithm-selector">
            <div class="algo-buttons">
                <button id="btn-algo-id3" class="btn-algo active">ID3</button>
                <button id="btn-algo-minavg" class="btn-algo">Min Avg</button>
            </div>
        </div>
    </div>

    <div class="layout-board">
        <div class="status-text" id="status"></div>
        
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Cells generated by JS -->
            </div>
            <div id="min-avg-overlay" class="board-overlay" style="display: none;"></div>
        </div>
    </div>

    <div class="layout-controls">
        <!-- Min Avg Controls -->
        <div id="min-avg-controls" class="toolbar" style="display: none;">
            <div class="instruction-text" id="min-avg-instruction">AI 建议点击高亮格子，请告知结果：</div>
            <div class="btn-group feedback-group">
                <button class="btn-feedback f-void" data-status="1">未击中</button>
                <button class="btn-feedback f-body" data-status="2">机身</button>
                <button class="btn-feedback f-head" data-status="3">机头</button>
            </div>
            <div class="btn-group">
                <button class="secondary btn-undo" id="btn-undo" disabled>上一步</button>
                <button class="secondary btn-reset">重置</button>
            </div>
        </div>

        <!-- Play Mode Controls (ID3) -->
        <div id="play-controls" class="toolbar">
            <div class="btn-group">
                <button class="secondary btn-reset">再来一局</button>
                <button class="primary btn-ask">询问 AI</button>
            </div>
        </div>

        <!-- Explore Mode Controls -->
        <div id="explore-controls" class="toolbar" style="display: none;">
            <div class="palette">
                <div class="palette-item p-void" id="pal-1"></div>
                <div class="palette-item p-body" id="pal-2"></div>
                <div class="palette-item p-head" id="pal-3"></div>
            </div>
            <div class="btn-group">
                <button class="secondary btn-clear">清空棋盘</button>
                <button class="primary btn-ask">询问 AI</button>
            </div>
        </div>

        <div class="mode-switch" id="mode-switch-container">
            <a href="#" id="mode-link">进入自由探索模式</a>
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
